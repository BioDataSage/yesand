name: Analytics Metrics Check

on:
  workflow_dispatch:
    inputs:
      dataset_path:
        description: 'Path to the dataset to analyze'
        required: true
  pull_request:
    paths:
      - '**/*.csv'
      - '**/*.R'

jobs:
  run-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            tidyverse
            colorspace
            janitor
            scales

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: >
            /analytics-metrics
            Evaluate the dataset at ${{ github.event.inputs.dataset_path || 'the changed CSV files in this PR' }}.
            Then use /accessible-visualization to produce one chart
            visualizing the primary metric. Save the chart as
            metrics-chart.png in the repo root.
          claude_args: "--allowedTools Bash,Read,Write --max-turns 20"

      - name: Upload chart as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics-output
          path: |
            metrics-chart.png
            *.csv

      - name: Commit chart to branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add metrics-chart.png
          git diff --staged --quiet || git commit -m "Add updated metrics chart [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

      - name: Get commit SHA
        if: github.event_name == 'pull_request'
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Comment chart on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ### 📊 Analytics Metrics Chart

            ![Metrics chart](https://raw.githubusercontent.com/${{ github.repository }}/${{ steps.sha.outputs.sha }}/metrics-chart.png)

            _Generated automatically by the analytics-metrics skill._
